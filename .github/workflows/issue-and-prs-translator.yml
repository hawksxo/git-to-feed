name: 'Automated Content Translator'

on: 
  issue_comment: 
    types: [created]
  issues: 
    types: [opened]
  pull_request_review_comment: 
    types: [created]

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto Translate Issues and Comments
        uses: dromara/issues-translate-action@v2.8
        with:
          BOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_MODIFY_TITLE: true
          CUSTOM_BOT_NOTE: "🌐 **Automated Translation to English / Traducción automática al inglés:**"
