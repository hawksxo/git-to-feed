name: 'Automated Content Translator'

on: 
  issues: 
    types: [opened, edited]
  issue_comment: 
    types: [created, edited]
  pull_request: 
    types: [opened, edited]
  pull_request_review_comment: 
    types: [created, edited]

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Auto Translate Issues, PRs and Comments
        uses: tisfeng/issues-translate-action@v2.9.3
        with:
          BOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_MODIFY_TITLE: true
          PRIMARY_LANGUAGE: es
          SECONDARY_LANGUAGE: en
          CUSTOM_BOT_NOTE: "🌐 **Automated Translation to English / Traducción automática al inglés:**"
